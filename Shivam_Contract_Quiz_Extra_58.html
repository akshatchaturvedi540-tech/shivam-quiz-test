<script>const BANK=[{"q": "The Indian Contract Act, 1872 became operative from the date of", "o": ["25th April, 1872", "25th May, 1872", "1st September, 1872", "18th September, 1872"], "a": "c"}, {"q": "Under Indian Contract Act, goods displayed in a shop window with a prize label will amount to", "o": ["An offer", "An acceptance", "An invitation to offer", "Counter offer"], "a": "c"}, {"q": "Who said that \"An offer need not be made to an ascertained person, but no contract can arise until it has been accepted by an asertained person\"?", "o": ["Lord Atkin", "Lord Goddard", "Chashre and Fifoot", "Anson"], "a": "d"}, {"q": "In case of general offer, there is no need to communicate the acceptance if not required by the proposer. This has been held in", "o": ["Carlill v. Carbolic Smoke Ball Co.", "Bhagwandas v. Girdharilal", "Lalman Shukla v. Gauri Dutt", "Ramji Dayawala and Sons v. Investment Import"], "a": "a"}, {"q": "Which one is the famous case related with the general offer?", "o": ["Lalman Shukla v. Gauri Dutt", "Mohori Bibee v. Dharmodas Ghose", "Carlill v. Carbolic Smoke Ball Co.", "MacPherson v. Appanna"], "a": "c"}, {"q": "When goods are displayed in a shop window with tag attached to them, the offer comes from the", "o": ["offerer", "general public", "customer", "shop owner MP(ADPO) 2010"], "a": "c"}, {"q": "Which of the following statement is in-correct", "o": ["Every contract is an agreement but every agreement is not a contract", "The test of contractural intention should be objective and not subjective", "Acceptance is complete when it is communicated to the offeror", "The party inviting tender is bound to accept the tender"], "a": "d"}, {"q": "\"For an acceptance mere mental resolve to accept would not be sufficient, there must be some external manifestation of the intent by speech, writing or other act.\",", "o": ["Fazal Ilahi V. East Indian Railway Co", "M. Nanjappa V. M.P. Muthuswamy", "Dugdale V. Lovering", "Bhagwan Das V. Girdhari Lal & Co."], "a": "d"}, {"q": "The correct sequence information of contract is", "o": ["offer, consideration, acceptance, agreement", "agreement, consideration, offer, acceptance", "offer, acceptance, agreement, consideration", "offer, acceptance, consideration, agreement"], "a": "c"}, {"q": "Which of the following statements regarding consideration is not correct?", "o": ["It must be given at the desire of the promisor", "It may be past also", "It need not be adequate to the promise", "Stranger to it cannot sue."], "a": "d"}, {"q": "Following is a case on Promissory Estoppel", "o": ["Kedar Nath V. Gori Mohamed", "Delhi Cloth and general Mills Ltd. V. Union of India", "Both (a) and (b)(a) (b)", "None of the above"], "a": "c"}, {"q": "An agreement, which is enforceable by law at the option of one or more of the parties thereto, but not at the option of the other thereto", "o": ["is a void contract", "is a illegal contract", "is a voidable contract", "is an unenforceable agreement"], "a": "c"}, {"q": "'L' is sent to search for G's nephew in the meantime 'G' by advertisement offers a reward of Rs. 501 to any one who finds has nephew. 'L' traces the boy and subsequently knowing about the reward claims it. To the reward L is", "o": ["Entitled", "Not entitled as the offer is general", "Not entitled as the consideration is inadequate", "Is not entitled as the offer was not communicated to him"], "a": "d"}, {"q": "An offer was sent by post. The acceptor wrote 'Accepted' on the letter, put it in the drawer and forgot about it. The transaction is", "o": ["a valid contract", "a voidable contract", "a void contract", "No agreement as the acceptance was never communicated to the proposer"], "a": "d"}, {"q": "Which one of the following is not provided in Section 4 of the Contract Act, 1872?18724", "o": ["Communication of a proposal", "Communication of acceptance", "Communication of a revocation", "Revocation of proposals and acceptance"], "a": "d"}, {"q": "Which of the following statement is correct? The communication of an acceptance is complete, as against the acceptor", "o": ["When it comes to the knowledge of the acceptor", "When it comes to the knowledge of proposer", "When it comes to the knowledge of acceptor and proposer both", "When it comes to the third party"], "a": "b"}, {"q": "The Communication of an acceptance is complete as against the acceptor", "o": ["as soon as acceptance is made by the acceptor", "when it is put in the course of transmission to the proposer", "when it comes to the knowledge of the proposer", "none of the above"], "a": "c"}, {"q": "Communication of acceptance is complete as against the proposer", "o": ["When it comes to the knowledge of the proposer", "When it is put in the course of transmission to the proposer so as to be out of power of the acceptor", "When the acceptance is communicated to the proposer", "All the above"], "a": "b"}, {"q": "The notice of acceptance against the proposer is completed when.", "o": ["Letter of acceptance is written by acceptor.", "Letter of acceptance is sent by post by acceptor", "Letter of accepance is received by acceptor", "The letter of acceptance is read by the proposer"], "a": "b"}, {"q": "Communication of acceptance is complete as against the proposer when", "o": ["it comes to the knowledge of the proposer", "it is put in the course of Transmission so as to be out of the power of the acceptor", "the acceptance is communicated to the proposer", "All of the above"], "a": "b"}, {"q": "Which one of the following is not provided in Section 4 and 5 of the Contract Act?", "o": ["Communication of offer", "Communication of acceptance", "Revocation of proposal and acceptance", "Revocation of contract"], "a": "d"}, {"q": "Which one of the following statements is correct? The communication of an acceptance is complete as against the acceptor", "o": ["when it comes to the knowledge of the acceptor", "when it comes to the knowledge of the proposer", "when it comes to the knowledge of the acceptor and proposer both", "when it comes to the knowledge of the third party"], "a": "b"}, {"q": "'A contract of telephone becomes complete at the place where acceptance is heard. In which case it has been held?", "o": ["Bhagwandas v. Girdharilal", "Carlill v. Carbolic Smoke ball Co.", "Mohribibi v. Dharmodas Ghosh", "Satyabratta Ghosh v Mugneeram"], "a": "a"}, {"q": "In the following cases which case relates to general offers", "o": ["Lalman Shukla Vs. Gauri Datt", "Carlill Vs. Carbolic Smoke Ball Comp.", "Both (a) and (b)", "None of the above"], "a": "c"}, {"q": "In which of the following cases was the legality of contract over telephone decided?", "o": ["Hyde v. Wrench", "Powel v. Lee", "Entores Ltd. v. Miles Far East corporation /", "Said v. Butt"], "a": "c"}, {"q": "The rule laid down in Adam v. Lindsell was approved by the House of Lords in", "o": ["Dunlop v. Higgins", "Elliason v. Henshaw", "Powell v. Lee", "Hyde v. Wrench"], "a": "a"}, {"q": "In which of the following cases a propsal can be revoked when it is made by post?", "o": ["Before the promisee posts his letter of acceptance", "Till the letter of acceptance reaches the promisor", "Till the promise receives the acknowled gement that the letter of acceptance has been delivered to the promisor", "Proposal once made cannot be revoked"], "a": "a"}, {"q": "A proposal can be revoked by the proposer", "o": ["by the communication of notice by the proposer to the other party", "by the lapse of time prescribed in such proposal for its acceptance", "by the failure of the acceptor to fulfill a condition precedent to acceptance", "All of the above"], "a": "d"}, {"q": "When a counter proposal is accepted the contract arises", "o": ["in term of original offer", "in terms of counter proposal", "in terms of provisional offer", "all of above UP (HJS) 2016"], "a": "b"}, {"q": "In order to convert a proposal into a promise the acceptance must", "o": ["Be absolute and qualified", "Be expressed in some usual and reasonable manner", "oth ( ) and ( )", "None of these"], "a": "c"}, {"q": "In order to convert a proposal into a promise", "o": ["the acceptance of proposal must be absolute and unqualified", "the acceptance of proposal may be varied", "the acceptance of proposal may be conditional", "the acceptance of proposal may be absolute, varied or conditional"], "a": "a"}, {"q": "Which one of the following statements is not correct?", "o": ["Acceptance must be in writing", "Acceptance must be communicated", "Acceptance must be prescribed manner", "Oral acceptance is a valid acceptance"], "a": "a"}, {"q": "Which of the following statements is not correct?", "o": ["Acceptance must be communicated", "Acceptance must be in writing", "Oral acceptance is a valid acceptance", "Acceptance must be in the prescribed manner"], "a": "b"}, {"q": "Which of the following is a valid acceptance of a proposal?", "o": ["When an acceptance is made in ignorance of the proposal", "When an acceptance is made in usual and reasonable manner but not in a manner prescribed by the proposer", "When an acceptance is made in a manner prescribed by the proposer", "None of the above"], "a": "c"}, {"q": "Difference between a contract and social agreement is that of", "o": ["consideration", "intention to create legal relationship", "consensus ad idem", "certainty of performance"], "a": "b"}, {"q": "Under Indian Contract Act, when does an agreement becomes a contract?", "o": ["It is enforceable by law", "It is between parties competent to contract", "It is by the free consent of parties", "All of these"], "a": "d"}, {"q": "Which one of the following elements is not necessary for a contract?", "o": ["Competent parties", "Reasonable terms and conditions", "Free consent", "Lawful consideration"], "a": "b"}, {"q": "A contract with or by a minor is a contract", "o": ["valid", "void", "voidable", "voidable at option of either party MP HCCJ 2006"], "a": "b"}, {"q": "The age of majority for contract is", "o": ["18 years", "21 years", "16 years", "18 years for girls and 21 years for boys Chhattisgarh (J) 2003 UGC NET December 2011"], "a": "a"}, {"q": "'Offer' or 'Proposal' is defined in Indian Contract Act in", "o": ["Section 2(a)", "Section 2(b)", "Section 2(d)", "Section 2(e)"], "a": "a"}, {"q": "The display of articles in a showroom indicating their prices amounts to", "o": ["offer", "counteroffer", "mere advertisement", "invitation to offer"], "a": "d"}, {"q": "Examine the following statements 1. Every contract is agreement 2. Every agreement is a contract 3. Every lawful civil obligation is a contract 4. Every contract has a legally enforceable civil obligation. Which of these statements are correct?", "o": ["1 and 4", "1 and 2", "2 and 3", "3 and 4"], "a": "a"}, {"q": "In Indian Contract Act, the term voidable contract has been defined under", "o": ["Section 2 (e)2(e)", "Section 2 (h)2(h)", "Section 2 (i)2(i)", "Section 2 (g)2(g) MP ADPO 2016"], "a": "c"}, {"q": "The manner of revocation of a proposal has been provided under the Indian Contract Act, 1872 in", "o": ["Section 4", "Section 5", "Section 6", "Section 7"], "a": "b"}, {"q": "In standard form contracts", "o": ["the individual has no choice but to accept", "the individual has many choices to accept or refuse", "the agreement is without consideration", "None of the above"], "a": "a"}, {"q": "Under the Indian Contract Act", "o": ["a stranger to the contract can sue", "a stranger to the contract cannot sue", "a stranger but beneficialy under the contract can sue", "None of the above"], "a": "b"}, {"q": "A Voidable contract is one which", "o": ["Can be enforced at the option of aggrieved party", "Can be enforced at the option of both the parties", "Cannot be enforced in court of Law", "Courts prohibit"], "a": "a"}, {"q": "A proposal cannot be revoked", "o": ["By failure of the acceptor to fulfil a condition precendent to acceptance", "By lapse of the time prescribed in the proposal for its acceptance", "By insanity of the proposer, if the fact of insanity comes to the knowledge of the acceptor before acceptance", "After the communication of its acceptance is complete"], "a": "d"}, {"q": "Acceptance sent through post", "o": ["cannot be revoked at all", "can be revoked at any time", "can be revoked only if it does not reach the offerer", "can the revoked before it comes to the knowledge of the offerer"], "a": "d"}, {"q": "A proposal is revoked", "o": ["Only by the death or insanity of the proposer itself", "by the death or insanity if the fact of his death or insanity comes to the knowledge of the acceptor ,", "by the death or insanity of the proposer if the fact of his death or insanity comes to the knowledge of the acceptor before acceptance. ,", "none of the above is correct."], "a": "c"}, {"q": "The acceptance must be", "o": ["received within a week", "received within a fortnight", "absolute and unqualified", "absolute and qualified"], "a": "c"}, {"q": "Who is competent to contract?", "o": ["Person of unsound mind", "Person who has not attained majority", "Person who has been disqualified from contracting by the Court", "Person who has been debarred from contesting any elections"], "a": "d"}, {"q": "Minor's contract is", "o": ["void", "voidable", "void at the option of minor", "valid at the option of the minor"], "a": "a"}, {"q": "Illegality renders a contract", "o": ["void", "voidable", "illegal", "punishable"], "a": "a"}, {"q": "Which one of the following is correct?", "o": ["All agreements are contracts once they have been made between the parties for a consideration", "All agreements are contracts once they have been made between the parties with their free consent", "All agreements are contracts once they have been made between the competent parties", "All agreements are contracts if they are made by the free consent of parties competent to contract for lawful consideration and lawful object and not expressly declared by law to be void"], "a": "d"}, {"q": "According to Section 4 of the Indian contract act, the communication of acceptance against the acceptor is completed when.", "o": ["It come to the Knowledge of the proposer.", "Is communicated to the proposer", "He is given in the sequence of transmission", "It becomes beyand the power of withdrawal of the person doing it MP (HJS) 2018"], "a": "a"}, {"q": "Which one of the following statements is true", "o": ["An offer can be revoked but an acceptance cannot", "An acceptance can be revoked but an offer cannot", "Offer and acceptance are revocable", "Offer and acceptance are irrevocable MP (HJS) 20"], "a": "c"}, {"q": "On approval of tender", "o": ["a concluded contract arises immediately", "a concluded contract arises only when an order is placed on the basis of tender", "the tender is converted into a standing offer", "both, a concluded contract arises only when an order is placed on the basis of tender and the tender is converted into a standing offer MP (HJS) 20"], "a": "a"}];
let questions=[],current=0,score=0,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){const wanted=document.getElementById('count').value;const n=wanted==='all'?BANK.length:Math.min(+wanted,BANK.length);questions=shuffle(BANK).slice(0,n).map(x=>{const opts=x.o.map((text,i)=>({text,correct:String.fromCharCode(97+i)===x.a}));return{q:x.q,opts:shuffle(opts)}});current=0;score=0;document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
function render(){locked=false;const x=questions[current];document.getElementById('counter').textContent=`Question ${current+1} / ${questions.length}`;document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('bar').style.width=`${(current/questions.length)*100}%`;document.getElementById('question').textContent=x.q;document.getElementById('feedback').textContent='';const box=document.getElementById('options');box.innerHTML='';x.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o.text;b.onclick=()=>answer(i);box.appendChild(b)});document.getElementById('next').classList.add('hidden')}
function answer(i){if(locked)return;locked=true;const x=questions[current],bs=[...document.querySelectorAll('.option')];x.opts.forEach((o,k)=>{if(o.correct)bs[k].classList.add('correct')});if(x.opts[i].correct){score++;document.getElementById('feedback').textContent='✓ Correct!'}else{bs[i].classList.add('wrong');document.getElementById('feedback').textContent='✗ Incorrect'}document.getElementById('score').textContent=`Score: ${score}`;const n=document.getElementById('next');n.textContent=current===questions.length-1?'Finish':'Next';n.classList.remove('hidden')}
document.getElementById('next').onclick=()=>{if(current<questions.length-1){current++;render()}else{document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('final').textContent=`${score} / ${questions.length}`;document.getElementById('summary').textContent='Shivam Contract Quiz — extra questions';}};
document.getElementById('startBtn').onclick=build;document.getElementById('again').onclick=()=>{document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden')};</script></body></html>
